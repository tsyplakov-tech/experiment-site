
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 20
    env:
      SITE_PORT: ${{ vars.APP_PORT || '8080' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check Docker Compose
        run: docker compose version
      - name: Build site
        run: docker compose -p experiment-site build --pull
      - name: Deploy site
        run: docker compose -p experiment-site up -d --wait --wait-timeout 90 --remove-orphans
      - name: Show deployment status
        if: always()
        run: |
          docker compose -p experiment-site ps
          docker compose -p experiment-site logs --tail=100
